<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f2" />

      content="Lens & Legacy is a photography, film and event studio for sport, weddings and special occasions. We capture the moments that deserve to be remembered."

    <script>
      // Light is the default. Dark is opt-in and remembered.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
